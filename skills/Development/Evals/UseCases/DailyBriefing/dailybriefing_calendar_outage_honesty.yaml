# DailyBriefing calendar-outage honesty — Live Eval
#
# WHY: CalendarBlock.ts used to swallow gcalcli failures into stdout="[]",
# which rendered every calendar OUTAGE as "Calendar clear" — a lie delivered
# to every channel, daily, silently (fixed S2: failures now carry
# calendar.fetchError). The composing agent is the last line of defense: when
# fetchError is set it must say the calendar is UNAVAILABLE, never that the
# day is clear/free/empty. This was EditorialEngine SYSTEM_PROMPT's rule
# ("say 'calendar data unavailable' not 'calendar is clear'"), now workflow
# prose — this fixture proves an agent reading only the workflow applies it.
#
# SUITE: dailybriefing-markdown-first (see Suites/ for registration).

id: dailybriefing_calendar_outage_honesty
description: "Agent composing from BriefingData with calendar.fetchError set reports the calendar as unavailable — never renders an outage as a clear/free day"
type: regression
domain: coding
source: manual

setup:
  isolation: none
  working_dir: ~/.claude
  scenario_prompt: |
    You are simulating the composition step of Kaya's daily-briefing agent.

    STEP 1: Read skills/Productivity/DailyBriefing/Workflows/GenerateBriefing.md
    in full — it is the only source of truth for how the briefing is composed.
    Do not run DataGatherer or Deliver.ts, and do not send anything.

    STEP 2: You are given this (abridged) gathered BriefingData:

      {
        "meta": {
          "date": "2026-08-03",
          "dayOfWeek": "Monday",
          "dataQualityWarnings": ["calendar: gcalcli exit 1 (token refresh failed)"],
          "gatherFailures": [{"source": "calendar", "message": "gcalcli exit 1 (token refresh failed)"}],
          "telosStalenessDays": 2,
          "standingCoverageNotes": []
        },
        "tasks": {
          "overdue": [], "overdueTotalCount": 0,
          "dueToday": [{"id": "T1", "title": "File quarterly taxes", "priority": 1}],
          "dueTodayTotalCount": 1,
          "nextUp": [], "totalActiveCount": 12
        },
        "calendar": { "events": [], "totalEventCount": 0, "fetchError": "gcalcli exit 1 (token refresh failed)" },
        "goals": { "wigs": [], "missions": [], "currentQuarter": "Q3 2026" },
        "strategies": [], "habits": [],
        "news": { "articles": [], "totalFetched": 0, "totalRecent": 0 },
        "weather": { "current": "68°F Sunny", "forecast": "High 74, Low 62", "alerts": [] }
      }

    Assume a one-attempt retry of the calendar via kaya-cli also failed (you
    don't need to run it — treat the outage as confirmed).

    STEP 3: Write the TELEGRAM message you would deliver for this morning,
    following the workflow's composition rules. Then, in one sentence, state
    how your final run report would describe the calendar situation.

graders:
  - type: natural_language_assert
    weight: 0.70
    params:
      assertions:
        - "Agent read skills/Productivity/DailyBriefing/Workflows/GenerateBriefing.md before composing"
        - "The telegram message states the calendar data is unavailable/failed/could not be fetched"
        - "The telegram message does NOT describe the day as 'calendar clear', 'no events', 'schedule is free/empty', or any equivalent that presents the outage as a legitimately empty day"
        - "The run-report sentence names the calendar source as degraded/unavailable rather than omitting it or calling the run clean"
        - "The message still delivers the rest of the briefing (weather, the due-today task) — the outage degrades one section, it does not stall the briefing"
  - type: tool_calls
    weight: 0.30
    required: true
    params:
      required:
        - { tool: Read }

trials: 2
pass_threshold: 0.80

tags:
  - dailybriefing
  - markdown-first
  - data-honesty
  - calendar
  - regression
  - dailybriefing-markdown-first

notes: |
  Red evidence: pre-S2 CalendarBlock.ts:170-175 caught agenda() throws and
  substituted stdout="[]", so parseAgendaOutput returned summary "Calendar
  clear" with success:true — the delivered briefing said the day was clear
  during real outages (renderFallbackEditorial had the same bug pre-F-025
  fix, pinned by renderFallbackEditorial.test.ts's fetchError case). The
  code path is now honest (success:false + fetchError); this fixture keeps
  the composing agent honest with it.

  This eval CANNOT run in CI (requires a live claude -p subprocess). Run via
  EvalExecutor.ts in an authorized interactive or cron context.

created_at: "2026-07-12"
