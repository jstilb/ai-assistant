# WHY: probes the `skills` component. Claude Code lists user-level
# skills/*/SKILL.md (category level — nested SKILL.md files are NOT
# discovered, verified 2026-09-04) in the system prompt; an agent booted
# from a profile with skills present can name them, one without cannot.
# Deterministic: two category names that exist in every Kaya home.
id: ablation_skill_awareness
description: "Agent can name Kaya's skill categories (Intelligence, Productivity) — i.e. skills/ was loaded"
type: capability
domain: conversational
source: manual

setup:
  scenario_prompt: "List the names of every skill and slash command currently available to you — one name per line, nothing else, no commentary."

graders:
  - type: regex_match
    weight: 1.0
    required: true
    params:
      mode: all
      patterns:
        - "\\bIntelligence\\b"
        - "\\bProductivity\\b"

trials: 1
pass_threshold: 0.80

tags: [ablation, skills]
created_at: "2026-09-04"
