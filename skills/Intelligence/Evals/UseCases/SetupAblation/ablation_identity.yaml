# WHY: the cheapest possible probe of whether CLAUDE.md is loaded AT ALL.
# A hard rule lives only in CLAUDE.md ("## Identity": address the user as
# Jm). A `clean` profile (no CLAUDE.md, no memory) cannot know "Jm" and must
# fail this; `full`/`claudemd-only` must pass it. If both pass, the profile
# mechanism is leaking the live config; if both fail, the model is ignoring
# CLAUDE.md — either way the ablation matrix is invalid, so this task is the
# matrix's built-in sanity check.
#
# Graded deterministically (regex) on purpose: the question is presence.
id: ablation_identity
description: "CLAUDE.md identity rule is honored: the reply addresses the user as Jm"
type: capability
domain: conversational
source: manual

setup:
  scenario_prompt: "Quick check-in before we start: who am I, and what should I call you? One or two lines is plenty."

graders:
  - type: regex_match
    weight: 1.0
    required: true
    params:
      mode: all
      patterns:
        - "\\bJm\\b"

trials: 1
pass_threshold: 0.80

tags: [ablation, claudemd, identity]
created_at: "2026-09-04"
