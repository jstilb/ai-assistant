<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>EventScout</title>
<style>
  :root {
    --bg: #fbfbfa;
    --panel: #ffffff;
    --ink: #1c1c1a;
    --muted: #6b6b66;
    --faint: #9a9a94;
    --line: #e7e6e2;
    --line-soft: #f0efeb;
    --accent: #2b6cb0;
    --chip: #f1f0ec;
    --hover: #f6f5f2;
    --radius: 7px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    color: var(--ink);
    background: var(--bg);
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  button { font: inherit; cursor: pointer; }

  /* ---- header / toolbar ---- */
  header {
    position: sticky; top: 0; z-index: 20;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    padding: 12px 20px;
  }
  .title-row { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 16px; font-weight: 650; margin: 0; letter-spacing: -0.01em; }
  .meta { color: var(--faint); font-size: 12px; }
  .spacer { flex: 1; }

  .toolbar {
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    margin-top: 11px;
  }
  input[type="search"], input[type="date"], select {
    font: inherit; color: var(--ink);
    border: 1px solid var(--line); border-radius: var(--radius);
    background: var(--panel); padding: 6px 9px;
  }
  input[type="search"] { min-width: 240px; }
  input[type="search"]:focus, input[type="date"]:focus, select:focus,
  details > summary:focus-visible {
    outline: 2px solid color-mix(in srgb, var(--accent) 35%, transparent);
    outline-offset: 1px;
  }
  .field { display: flex; align-items: center; gap: 6px; }
  .field label { color: var(--muted); font-size: 12px; }

  .ckbox { display: inline-flex; align-items: center; gap: 5px; color: var(--muted); font-size: 13px; }

  /* dropdown checklist (categories / sources) */
  details.dd { position: relative; }
  details.dd > summary {
    list-style: none; user-select: none;
    border: 1px solid var(--line); border-radius: var(--radius);
    background: var(--panel); padding: 6px 10px; color: var(--ink);
    display: inline-flex; align-items: center; gap: 6px;
  }
  details.dd > summary::-webkit-details-marker { display: none; }
  details.dd > summary::after { content: "▾"; color: var(--faint); font-size: 10px; }
  details.dd[open] > summary { border-color: var(--accent); }
  .dd-panel {
    position: absolute; top: calc(100% + 4px); left: 0; z-index: 30;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); box-shadow: 0 8px 28px rgba(0,0,0,.10);
    padding: 8px; min-width: 220px; max-height: 320px; overflow: auto;
  }
  .dd-panel .row { display: flex; align-items: center; gap: 7px; padding: 4px 6px; border-radius: 5px; }
  .dd-panel .row:hover { background: var(--hover); }
  .dd-panel .row label { flex: 1; cursor: pointer; }
  .dd-panel .row .cnt { color: var(--faint); font-size: 11px; }
  .dd-tools { display: flex; gap: 8px; padding: 4px 6px 8px; border-bottom: 1px solid var(--line-soft); margin-bottom: 4px; }
  .linkbtn { background: none; border: none; color: var(--accent); padding: 0; font-size: 12px; }

  .btn {
    border: 1px solid var(--line); background: var(--panel);
    border-radius: var(--radius); padding: 6px 12px; color: var(--ink);
  }
  .btn:hover { background: var(--hover); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { background: #255d98; }
  .btn:disabled { opacity: .5; cursor: default; }

  /* ---- status banner ---- */
  #status {
    display: none; margin: 0 20px; margin-top: 10px;
    border: 1px solid var(--line); border-radius: var(--radius);
    background: #fffdf5; padding: 10px 12px; font-size: 13px;
  }
  #status.show { display: block; }
  #status .st-head { display: flex; align-items: center; gap: 8px; font-weight: 600; }
  #status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: pulse 1.1s infinite; }
  #status.done .dot { background: #2f9e44; animation: none; }
  #status.fail .dot { background: #d64545; animation: none; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
  #status pre {
    margin: 8px 0 0; max-height: 150px; overflow: auto;
    background: #faf9f4; border: 1px solid var(--line-soft); border-radius: 5px;
    padding: 8px; font: 11.5px/1.5 ui-monospace, "SF Mono", Menlo, monospace; color: var(--muted);
    white-space: pre-wrap;
  }

  /* ---- table ---- */
  main { padding: 14px 20px 60px; }
  .count-line { color: var(--faint); font-size: 12px; margin: 4px 2px 10px; }
  table { width: 100%; border-collapse: collapse; }
  thead th {
    position: sticky; top: 0; z-index: 5;
    text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em;
    color: var(--muted); font-weight: 600; padding: 8px 10px;
    background: var(--bg); border-bottom: 1px solid var(--line);
    cursor: pointer; white-space: nowrap; user-select: none;
  }
  thead th .arrow { color: var(--faint); font-size: 10px; margin-left: 3px; }
  tbody tr.ev { border-bottom: 1px solid var(--line-soft); cursor: pointer; }
  tbody tr.ev:hover { background: var(--hover); }
  tbody tr.ev.open { background: var(--hover); }
  td { padding: 8px 10px; vertical-align: top; }
  td.date { white-space: nowrap; color: var(--muted); font-variant-numeric: tabular-nums; width: 1%; }
  td.title { font-weight: 500; }
  td.venue { color: var(--muted); }
  td.cat { width: 1%; }
  td.src { color: var(--muted); white-space: nowrap; width: 1%; }
  td.price { color: var(--muted); white-space: nowrap; text-align: right; width: 1%; font-variant-numeric: tabular-nums; }

  .chip {
    display: inline-block; padding: 1px 8px; border-radius: 20px;
    background: var(--chip); color: var(--muted); font-size: 11.5px; white-space: nowrap;
    border: 1px solid transparent;
  }
  .chip.c-music{background:#eef2ff;color:#3b4fb0} .chip.c-comedy{background:#fef3e7;color:#b5731f}
  .chip.c-theater{background:#f6edff;color:#7a3fb0} .chip.c-sports{background:#e9f7ef;color:#2c7a4b}
  .chip.c-arts{background:#fdeef4;color:#b03b6b} .chip.c-community{background:#eef6fb;color:#2b6cb0}
  .chip.c-festival{background:#fff4e0;color:#b07d1f} .chip.c-talk{background:#eef0f2;color:#566}
  .chip.c-film{background:#eceaf6;color:#5547a0} .chip.c-food{background:#fdeeea;color:#b04a2f}
  .chip.c-other{background:#f0efeb;color:#777}

  /* ---- saved star ---- */
  td.starcell { width: 1%; padding-right: 0; }
  .starbtn {
    background: none; border: none; font-size: 15px; line-height: 1;
    color: var(--faint); padding: 1px 4px; border-radius: 4px;
  }
  .starbtn:hover, .starbtn.on { color: #e8a13c; }

  /* ---- detail row ---- */
  tr.detail > td { background: #fcfcfb; padding: 0 10px; border-bottom: 1px solid var(--line); }
  .detail-inner { display: flex; gap: 22px; padding: 14px 6px 18px; }
  .detail-main { flex: 1; min-width: 0; }
  .detail-side { width: 220px; flex-shrink: 0; }
  .detail-main h3 { margin: 0 0 4px; font-size: 15px; }
  .detail-when { color: var(--muted); margin-bottom: 10px; font-size: 13px; }
  .detail-desc { color: #3a3a36; white-space: pre-wrap; margin: 8px 0; max-height: 220px; overflow: auto; }
  .kv { display: grid; grid-template-columns: 88px 1fr; gap: 3px 10px; font-size: 13px; margin-top: 8px; }
  .kv dt { color: var(--faint); }
  .kv dd { margin: 0; color: var(--ink); }
  .tags { margin-top: 8px; display: flex; gap: 5px; flex-wrap: wrap; }
  .tag { background: var(--chip); color: var(--muted); font-size: 11px; padding: 1px 7px; border-radius: 4px; }
  .detail-side img { width: 100%; border-radius: 6px; border: 1px solid var(--line); margin-bottom: 10px; display: block; }
  .links { display: flex; flex-direction: column; gap: 7px; }
  .links a.linkrow {
    display: block; border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px;
    color: var(--accent); background: var(--panel); font-size: 13px;
  }
  .links a.linkrow:hover { background: var(--hover); text-decoration: none; }
  .links .src-list { font-size: 12px; color: var(--faint); margin-top: 2px; }

  .empty { text-align: center; color: var(--faint); padding: 60px 0; }
  #showMore { display: block; margin: 18px auto 0; }

  /* ---- phone (Tailscale access from the Pixel) ---- */
  @media (max-width: 640px) {
    header { position: static; padding: 10px 12px; }
    main { padding: 10px 8px 40px; }
    #status { margin: 10px 12px 0; }
    input[type="search"] { min-width: 0; flex: 1 1 100%; }
    .field:has(#srcRefresh) { flex: 1 1 100%; min-width: 0; }
    #srcRefresh { flex: 1; min-width: 0; }
    th[data-sort="category"], th[data-sort="source"], th[data-sort="price"],
    td.cat, td.src, td.price { display: none; }
    td, thead th { padding: 7px 5px; }
    .detail-inner { flex-direction: column; gap: 12px; }
    .detail-side { width: auto; }
  }
</style>
</head>
<body>
<header>
  <div class="title-row">
    <h1>EventScout</h1>
    <span class="meta" id="freshness">loading…</span>
    <div class="spacer"></div>
    <button class="btn primary" id="refreshAll">⟳ Refresh all</button>
    <div class="field">
      <select id="srcRefresh" title="Refresh a single source">
        <option value="">Refresh one source…</option>
      </select>
      <button class="btn" id="srcRefreshGo">Go</button>
    </div>
  </div>

  <div class="toolbar">
    <input type="search" id="q" placeholder="Search title, venue, source, performers, tags…" autocomplete="off" />

    <div class="field">
      <label for="from">From</label>
      <input type="date" id="from" />
    </div>
    <div class="field">
      <label for="to">To</label>
      <input type="date" id="to" />
    </div>

    <details class="dd" id="catDD">
      <summary><span id="catLabel">Categories</span></summary>
      <div class="dd-panel" id="catPanel"></div>
    </details>

    <details class="dd" id="srcDD">
      <summary><span id="srcLabel">Sources</span></summary>
      <div class="dd-panel" id="srcPanel"></div>
    </details>

    <label class="ckbox"><input type="checkbox" id="freeOnly" /> Free only</label>
    <label class="ckbox" title="Show only events you saved"><input type="checkbox" id="savedOnly" /> ★ Saved<span id="savedCount"></span></label>
    <button class="linkbtn" id="clearFilters">Clear filters</button>
  </div>
</header>

<div id="status">
  <div class="st-head"><span class="dot"></span><span id="statusLabel"></span></div>
  <pre id="statusLog"></pre>
</div>

<main>
  <div class="count-line" id="countLine"></div>
  <table>
    <thead>
      <tr id="headRow">
        <th aria-label="Saved"></th>
        <th data-sort="date">Date</th>
        <th data-sort="title">Title</th>
        <th data-sort="venue">Venue</th>
        <th data-sort="category">Category</th>
        <th data-sort="source">Source</th>
        <th data-sort="price" style="text-align:right">Price</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  <button class="btn" id="showMore" style="display:none">Show more</button>
  <div class="empty" id="empty" style="display:none">No events match these filters.</div>
</main>

<script>
const PT = "America/Los_Angeles";
const dayFmt  = new Intl.DateTimeFormat("en-US", { weekday: "short", month: "numeric", day: "numeric", timeZone: PT });
const timeFmt = new Intl.DateTimeFormat("en-US", { hour: "numeric", minute: "2-digit", timeZone: PT });
const ymdFmt  = new Intl.DateTimeFormat("en-CA", { year: "numeric", month: "2-digit", day: "2-digit", timeZone: PT });
const longFmt = new Intl.DateTimeFormat("en-US", { weekday: "long", month: "long", day: "numeric", year: "numeric", hour: "numeric", minute: "2-digit", timeZone: PT });

let STATE = { events: [], sources: [], lastUpdated: "", saved: [] };
let srcNames = {};            // id -> friendly name
let savedIds = new Set();     // event ids currently saved
let savedAtById = {};         // event id -> savedAt ISO
let sort = { key: "date", dir: 1 };
let renderLimit = 150;
const PAGE = 150;
const openRows = new Set();   // event ids currently expanded

const $ = (s) => document.querySelector(s);

// ---- load ----
async function loadData() {
  const r = await fetch("/api/data");
  STATE = await r.json();
  srcNames = {};
  for (const s of STATE.sources) srcNames[s.id] = s.name;
  for (const e of STATE.events) augment(e);
  refreshSavedIndex();
  buildSourceRefreshDropdown();
  buildCategoryFilter();
  buildSourceFilter();
  setFreshness();
  apply();
}

function augment(e) {
  const d = new Date(e.startDatetime);
  e._t = d.getTime();
  e._ymd = isNaN(e._t) ? "" : ymdFmt.format(d);          // YYYY-MM-DD in PT
  e._dateLabel = isNaN(e._t) ? "—" : dayFmt.format(d);
  e._timeLabel = (isNaN(e._t) || e.allDay) ? "" : timeFmt.format(d).replace(/\s/g, "").toLowerCase();
  e._srcIds = (e.sources || []).map((s) => s.sourceId);
  e._srcLabel = e._srcIds.map((id) => srcNames[id] || id).join(", ") || "—";
  e._price = priceLabel(e);
  e._priceKey = e.isFree ? 0 : (typeof e.priceMin === "number" ? e.priceMin : Number.POSITIVE_INFINITY);
  const tagStr = (e.tags || []).join(" ");
  e._blob = [e.title, e.venue, e.address, e.performersOrTeams, e.description, e._srcLabel, e._srcIds.join(" "), tagStr, e.category]
    .filter(Boolean).join(" ").toLowerCase();
}

function priceLabel(e) {
  if (e.isFree) return "free";
  const cur = e.currency === "USD" || !e.currency ? "$" : (e.currency + " ");
  const f = (n) => cur + (Number.isInteger(n) ? n : n.toFixed(2));
  if (typeof e.priceMin === "number" && typeof e.priceMax === "number" && e.priceMax !== e.priceMin)
    return f(e.priceMin) + "–" + f(e.priceMax).replace(cur, "");
  if (typeof e.priceMin === "number") return f(e.priceMin);
  if (typeof e.priceMax === "number") return f(e.priceMax);
  return "—";
}

function refreshSavedIndex() {
  STATE.saved = STATE.saved || [];
  savedIds = new Set(STATE.saved.map((s) => s.event.id));
  savedAtById = {};
  for (const s of STATE.saved) { savedAtById[s.event.id] = s.savedAt; augment(s.event); }
  $("#savedCount").textContent = STATE.saved.length ? ` (${STATE.saved.length})` : "";
}

// ---- save / unsave ----
async function toggleSave(e) {
  const on = savedIds.has(e.id);
  // Snapshot fallback lets a past event that already left the cache be re-saved.
  const body = on ? { id: e.id } : { id: e.id, event: e };
  const r = await fetch(on ? "/api/saved/remove" : "/api/saved/add", {
    method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body),
  });
  const j = await r.json().catch(() => null);
  if (!r.ok || !j || !j.saved) { alert((j && j.error) || "Saving failed."); return; }
  STATE.saved = j.saved;
  refreshSavedIndex();
  render();
}

function setFreshness() {
  const n = STATE.events.length;
  const when = STATE.lastUpdated ? new Date(STATE.lastUpdated) : null;
  const ago = when && !isNaN(when) ? `· data fetched ${longFmt.format(when)}` : "";
  $("#freshness").textContent = `${n.toLocaleString()} events ${ago}`;
}

// ---- filter UI builders ----
function buildSourceRefreshDropdown() {
  const sel = $("#srcRefresh");
  sel.innerHTML = '<option value="">Refresh one source…</option>';
  for (const s of [...STATE.sources].sort((a, b) => a.name.localeCompare(b.name))) {
    const o = document.createElement("option");
    o.value = s.id; o.textContent = s.name;
    sel.appendChild(o);
  }
}

function countBy(keyFn) {
  const m = {};
  for (const e of STATE.events) for (const k of [].concat(keyFn(e))) m[k] = (m[k] || 0) + 1;
  return m;
}

function buildCategoryFilter() {
  const counts = countBy((e) => e.category);
  const cats = Object.keys(counts).sort((a, b) => counts[b] - counts[a]);
  const panel = $("#catPanel");
  panel.innerHTML =
    `<div class="dd-tools"><button class="linkbtn" data-all="cat">All</button><button class="linkbtn" data-none="cat">None</button></div>` +
    cats.map((c) =>
      `<div class="row"><input type="checkbox" class="catck" id="cat-${c}" value="${c}" />` +
      `<label for="cat-${c}"><span class="chip c-${c}">${c}</span></label><span class="cnt">${counts[c]}</span></div>`
    ).join("");
  panel.querySelectorAll(".catck").forEach((cb) => cb.addEventListener("change", () => { updateCatLabel(); apply(); }));
  panel.querySelector('[data-all="cat"]').addEventListener("click", () => { panel.querySelectorAll(".catck").forEach(c=>c.checked=true); updateCatLabel(); apply(); });
  panel.querySelector('[data-none="cat"]').addEventListener("click", () => { panel.querySelectorAll(".catck").forEach(c=>c.checked=false); updateCatLabel(); apply(); });
}

function buildSourceFilter() {
  const counts = countBy((e) => e._srcIds);
  const srcs = [...STATE.sources].filter((s)=>counts[s.id]).sort((a, b) => (counts[b.id]||0) - (counts[a.id]||0));
  const panel = $("#srcPanel");
  panel.innerHTML =
    `<div class="dd-tools"><button class="linkbtn" data-all="src">All</button><button class="linkbtn" data-none="src">None</button></div>` +
    srcs.map((s) =>
      `<div class="row"><input type="checkbox" class="srcck" id="src-${s.id}" value="${s.id}" />` +
      `<label for="src-${s.id}">${s.name}</label><span class="cnt">${counts[s.id]}</span></div>`
    ).join("");
  panel.querySelectorAll(".srcck").forEach((cb) => cb.addEventListener("change", () => { updateSrcLabel(); apply(); }));
  panel.querySelector('[data-all="src"]').addEventListener("click", () => { panel.querySelectorAll(".srcck").forEach(c=>c.checked=true); updateSrcLabel(); apply(); });
  panel.querySelector('[data-none="src"]').addEventListener("click", () => { panel.querySelectorAll(".srcck").forEach(c=>c.checked=false); updateSrcLabel(); apply(); });
}

function checkedValues(cls) { return [...document.querySelectorAll("." + cls + ":checked")].map((c) => c.value); }
function updateCatLabel() { const n = checkedValues("catck").length; $("#catLabel").textContent = n ? `Categories (${n})` : "Categories"; }
function updateSrcLabel() { const n = checkedValues("srcck").length; $("#srcLabel").textContent = n ? `Sources (${n})` : "Sources"; }

// ---- filtering + sorting ----
function apply() {
  renderLimit = PAGE;
  render();
}

function currentFiltered() {
  const q = $("#q").value.trim().toLowerCase();
  const terms = q ? q.split(/\s+/) : [];
  const from = $("#from").value;     // YYYY-MM-DD or ""
  const to = $("#to").value;
  const cats = new Set(checkedValues("catck"));
  const srcs = new Set(checkedValues("srcck"));
  const freeOnly = $("#freeOnly").checked;
  const savedOnly = $("#savedOnly").checked;

  // Saved view draws from the saved store (fresh cache copy when it exists,
  // else the snapshot — so saved picks outlive cache regeneration).
  let pool = STATE.events;
  if (savedOnly) {
    const cacheById = new Map(STATE.events.map((e) => [e.id, e]));
    pool = STATE.saved.map((s) => {
      const live = cacheById.get(s.event.id);
      if (live) return live;
      s.event._gone = true;
      return s.event;
    });
  }

  let out = pool.filter((e) => {
    if (cats.size && !cats.has(e.category)) return false;
    if (srcs.size && !e._srcIds.some((id) => srcs.has(id))) return false;
    if (freeOnly && !e.isFree) return false;
    if (from && e._ymd && e._ymd < from) return false;
    if (to && e._ymd && e._ymd > to) return false;
    if (terms.length && !terms.every((t) => e._blob.includes(t))) return false;
    return true;
  });

  const k = sort.key, dir = sort.dir;
  out.sort((a, b) => {
    let av, bv;
    if (k === "date") { av = a._t; bv = b._t; }
    else if (k === "price") { av = a._priceKey; bv = b._priceKey; }
    else if (k === "title") { av = a.title?.toLowerCase() || ""; bv = b.title?.toLowerCase() || ""; }
    else if (k === "venue") { av = a.venue?.toLowerCase() || ""; bv = b.venue?.toLowerCase() || ""; }
    else if (k === "category") { av = a.category; bv = b.category; }
    else if (k === "source") { av = a._srcLabel.toLowerCase(); bv = b._srcLabel.toLowerCase(); }
    if (av < bv) return -1 * dir;
    if (av > bv) return 1 * dir;
    return a._t - b._t; // stable-ish secondary by date
  });
  return out;
}

function render() {
  const filtered = currentFiltered();
  const tbody = $("#rows");
  tbody.innerHTML = "";
  $("#empty").style.display = filtered.length ? "none" : "block";

  const slice = filtered.slice(0, renderLimit);
  const frag = document.createDocumentFragment();
  for (const e of slice) {
    frag.appendChild(rowFor(e));
    if (openRows.has(e.id)) frag.appendChild(detailFor(e));
  }
  tbody.appendChild(frag);

  $("#countLine").textContent =
    `Showing ${Math.min(renderLimit, filtered.length).toLocaleString()} of ${filtered.length.toLocaleString()} filtered · ${STATE.events.length.toLocaleString()} total`;
  $("#showMore").style.display = filtered.length > renderLimit ? "block" : "none";

  // header arrows
  document.querySelectorAll("#headRow th").forEach((th) => {
    const a = th.querySelector(".arrow"); if (a) a.remove();
    if (th.dataset.sort === sort.key) {
      const s = document.createElement("span"); s.className = "arrow";
      s.textContent = sort.dir === 1 ? "▲" : "▼"; th.appendChild(s);
    }
  });
}

function esc(s) { return (s ?? "").toString().replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

function rowFor(e) {
  const tr = document.createElement("tr");
  tr.className = "ev" + (openRows.has(e.id) ? " open" : "");
  const srcShort = e._srcIds.length > 1 ? `${srcNames[e._srcIds[0]] || e._srcIds[0]} +${e._srcIds.length - 1}` : e._srcLabel;
  const on = savedIds.has(e.id);
  tr.innerHTML =
    `<td class="starcell"><button class="starbtn${on ? " on" : ""}" title="${on ? "Unsave" : "Save"}">${on ? "★" : "☆"}</button></td>` +
    `<td class="date">${esc(e._dateLabel)}${e._timeLabel ? ` <span style="color:var(--faint)">${esc(e._timeLabel)}</span>` : ""}</td>` +
    `<td class="title">${esc(e.title)}</td>` +
    `<td class="venue">${esc(e.venue || "")}</td>` +
    `<td class="cat"><span class="chip c-${e.category}">${e.category}</span></td>` +
    `<td class="src">${esc(srcShort)}</td>` +
    `<td class="price">${esc(e._price)}</td>`;
  tr.querySelector(".starbtn").addEventListener("click", (ev) => { ev.stopPropagation(); toggleSave(e); });
  tr.addEventListener("click", () => toggle(e.id));
  return tr;
}

function detailFor(e) {
  const tr = document.createElement("tr");
  tr.className = "detail";
  const td = document.createElement("td");
  td.colSpan = 7;

  const when = isNaN(e._t) ? esc(e.startDatetime) : longFmt.format(new Date(e.startDatetime));
  const links = [];
  if (e.ticketUrl) links.push(`<a class="linkrow" href="${esc(e.ticketUrl)}" target="_blank" rel="noopener">🎟  Tickets / event page →</a>`);
  if (e.sourceUrl && e.sourceUrl !== e.ticketUrl) links.push(`<a class="linkrow" href="${esc(e.sourceUrl)}" target="_blank" rel="noopener">🔗  Source page →</a>`);
  const extraSrc = (e.sources || []).filter((s) => s.url && s.url !== e.sourceUrl && s.url !== e.ticketUrl);
  const srcList = extraSrc.length
    ? `<div class="src-list">also via: ${extraSrc.map((s) => `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(srcNames[s.sourceId] || s.sourceId)}</a>`).join(" · ")}</div>`
    : "";

  const kv = [];
  if (e.venue) kv.push(["Venue", esc(e.venue)]);
  if (e.address) kv.push(["Address", esc(e.address)]);
  kv.push(["Category", `<span class="chip c-${e.category}">${e.category}</span>`]);
  kv.push(["Price", esc(e._price)]);
  if (e.performersOrTeams) kv.push(["Lineup", esc(e.performersOrTeams)]);
  if (e.status && e.status !== "scheduled") kv.push(["Status", `<b style="color:#c0392b">${esc(e.status)}</b>`]);
  if (savedAtById[e.id]) kv.push(["Saved", esc(dayFmt.format(new Date(savedAtById[e.id])))]);
  if (e._gone) kv.push(["Listing", `<span style="color:#c0392b">no longer in the catalog (saved snapshot)</span>`]);

  td.innerHTML =
    `<div class="detail-inner">
      <div class="detail-main">
        <h3>${esc(e.title)}</h3>
        <div class="detail-when">${when}</div>
        <dl class="kv">${kv.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl>
        ${e.tags && e.tags.length ? `<div class="tags">${e.tags.map((t) => `<span class="tag">${esc(t)}</span>`).join("")}</div>` : ""}
        ${e.description ? `<div class="detail-desc">${esc(e.description)}</div>` : ""}
      </div>
      <div class="detail-side">
        ${e.imageUrl ? `<img src="${esc(e.imageUrl)}" alt="" loading="lazy" onerror="this.style.display='none'"/>` : ""}
        <div class="links">
          <button class="btn savebtn">${savedIds.has(e.id) ? "★ Saved — unsave" : "☆ Save event"}</button>
          ${links.join("") || '<span class="meta">no links available</span>'}${srcList}
        </div>
      </div>
    </div>`;
  td.querySelector(".savebtn").addEventListener("click", (ev) => { ev.stopPropagation(); toggleSave(e); });
  tr.appendChild(td);
  return tr;
}

function toggle(id) {
  if (openRows.has(id)) openRows.delete(id); else openRows.add(id);
  render();
}

// ---- refresh ----
let pollTimer = null;
async function startRefreshAll() {
  if (!confirm("Re-fetch ALL sources? This re-ingests every source and can take a few minutes (some hit paid scrapers).")) return;
  const r = await fetch("/api/refresh", { method: "POST" });
  if (r.status === 409) { alert("A refresh is already running."); return; }
  beginPolling();
}
async function startRefreshSource() {
  const id = $("#srcRefresh").value;
  if (!id) { alert("Pick a source first."); return; }
  const r = await fetch("/api/refresh/source", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ id }) });
  if (!r.ok) { const j = await r.json().catch(()=>({})); alert(j.error || "Could not start refresh."); return; }
  beginPolling();
}

function beginPolling() {
  $("#refreshAll").disabled = true;
  $("#srcRefreshGo").disabled = true;
  if (pollTimer) clearInterval(pollTimer);
  poll();
  pollTimer = setInterval(poll, 1500);
}

async function poll() {
  const s = await (await fetch("/api/refresh/status")).json();
  const box = $("#status");
  if (!s.active) { box.className = ""; return; }
  box.classList.add("show");
  box.classList.toggle("done", !s.running && s.exitCode === 0);
  box.classList.toggle("fail", !s.running && s.exitCode !== 0 && s.exitCode !== null);
  const secs = Math.round((Date.now() - new Date(s.startedAt).getTime()) / 1000);
  $("#statusLabel").textContent = s.running ? `${s.label} … (${secs}s)` : (s.exitCode === 0 ? `${s.label} — complete` : `${s.label} — failed (exit ${s.exitCode})`);
  $("#statusLog").textContent = (s.lines || []).join("\n");
  $("#statusLog").scrollTop = $("#statusLog").scrollHeight;
  if (!s.running) {
    clearInterval(pollTimer); pollTimer = null;
    $("#refreshAll").disabled = false;
    $("#srcRefreshGo").disabled = false;
    await loadData(); // pull fresh cache into the table
  }
}

// ---- wire up ----
function debounce(fn, ms) { let t; return () => { clearTimeout(t); t = setTimeout(fn, ms); }; }
$("#q").addEventListener("input", debounce(apply, 160));
$("#from").addEventListener("change", apply);
$("#to").addEventListener("change", apply);
$("#freeOnly").addEventListener("change", apply);
$("#savedOnly").addEventListener("change", apply);
$("#showMore").addEventListener("click", () => { renderLimit += PAGE; render(); });
$("#refreshAll").addEventListener("click", startRefreshAll);
$("#srcRefreshGo").addEventListener("click", startRefreshSource);
$("#clearFilters").addEventListener("click", () => {
  $("#q").value = ""; $("#from").value = todayPT(); $("#to").value = "";
  document.querySelectorAll(".catck, .srcck").forEach((c) => c.checked = false);
  $("#freeOnly").checked = false;
  $("#savedOnly").checked = false;
  updateCatLabel(); updateSrcLabel(); apply();
});
document.querySelectorAll("#headRow th").forEach((th) => th.addEventListener("click", () => {
  const k = th.dataset.sort;
  if (!k) return; // star column is not sortable
  if (sort.key === k) sort.dir *= -1; else { sort.key = k; sort.dir = (k === "date" ? 1 : 1); }
  render();
}));
// close dropdowns on outside click
document.addEventListener("click", (e) => {
  document.querySelectorAll("details.dd[open]").forEach((d) => { if (!d.contains(e.target)) d.removeAttribute("open"); });
});

function todayPT() { return ymdFmt.format(new Date()); }
$("#from").value = todayPT(); // default: hide past events

loadData().catch((err) => { $("#freshness").textContent = "failed to load: " + err.message; });
</script>
</body>
